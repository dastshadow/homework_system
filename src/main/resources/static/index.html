<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>作业管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container{
            max-width:60%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>作业管理系统</h1>
    <div class="card mx-auto my-4" style="max-width:400px;">
        <div class="card-header bg-primary text-white">登录/注册</div>
        <div class="card-body">
    <input class="form-control mb-2" id="regUsername" placeholder="注册用户名">
    <input class="form-control mb-2" id="regPassword" placeholder="注册密码">
    <button class="btn btn-primary" onclick="register()">注册</button>
    <hr>
    <input class="form-control mb-2" id="loginUsername" placeholder="用户名">
    <input class="form-control mb-2" id="loginPassword" placeholder="密码">
    <button class="btn btn-success" onclick="login()">登录</button>
        </div>
    </div>

    <div id="teacherArea">
        <input id="nameInput" placeholder="输入作业名">
        <button class="btn btn-primary" onclick="addHomework()">添加</button>

        <input id="deleteInput" placeholder="输入要删除的作业的ID">
        <button class="btn btn-danger" onclick="deleteHomework()">删除</button>

        <input id="updateIDInput" placeholder="输入要修改的作业的ID">
        <input id="updateNameInput" placeholder="输入要修改的作业的名称">
        <button class="btn btn-warning" onclick="updateHomework()">修改</button>
    </div>
    <div id="aiArea">
    <h2>AI 题库检查</h2>
    <textarea id="questionInput" placeholder="粘贴题目：题干+选项+答案" rows="5" cols="40"></textarea>
    <button class="btn btn-info" onclick="checkQuestion()">AI 检查</button>
    </div>
    <div id="checkResult"></div>

    <div id="homeworklist"></div>
    <script>
        function register(){
            var username =document.getElementById("regUsername").value;
            var password = document.getElementById("regPassword").value;

            fetch("/register?username="+username+"&password="+password,{method:"POST"})
                .then(
                    function (response){
                        return response.text();
                    }
                )
                .then(
                    function (data){
                        alert(data);
                    }
                );

        }
        function login() {
            var username = document.getElementById("loginUsername").value;
            var password = document.getElementById("loginPassword").value;
            fetch("/login?username=" + username + "&password=" + password, { method: "POST" })
                .then(function(response) { return response.text(); })
                .then(function(data) {
                    var parts = data.split("|");          // 按 | 拆成两段
                    localStorage.setItem("token", parts[0]);   // 第一段是 token
                    localStorage.setItem("role", parts[1]);    // 第二段是角色
                    showByRole();
                    alert("登录成功");
                    loadHomework();
                });
        }
        function loadHomework() {
            var token = localStorage.getItem("token");
            fetch("/homework",{
                headers:{"Authorization":"Bearer "+token}
                })

                .then(function (response) {
                    return response.json();
                })
                .then(function (list) {
                        var html = "<table class='table table-striped table-hover'>";
                        html+="<thead class='table-dark'><tr><th>序号</th><th>作业名</th><th>布置老师</th></tr></thead><tbody>"
                        for(var i=0;i<list.length;i++){
                        html+="<tr><td>"+(i+1)+"</td><td>"+list[i].name+"</td><td>"+list[i].teacher+"</td></tr>";
                        }

                    html+="</table>";
                    document.getElementById("homeworklist").innerHTML = html;
        } );
        }
        function addHomework(){
            var name = document.getElementById("nameInput").value;
            var token =localStorage.getItem("token");
            fetch("/homework/add?name="+name
                ,{method:"POST"
                ,headers:{"Authorization":"Bearer "+token}}
            )
                .then(
                    function (response){
                        return response.text();
                    }

                )
                .then(
                    function (data){
                        alert(data);
                        document.getElementById("nameInput").value = "";
                        loadHomework();
                    }
                );
        }
        function deleteHomework(){
            var id = document.getElementById("deleteInput").value;
            var token = localStorage.getItem("token");
            fetch("/homework/"+id
                ,{method:"DELETE"
                ,headers:{"Authorization":"Bearer "+token}}
            )
                .then(
                    function (response){
                        return response.text();
                    }
                )
                .then(
                    function (data){
                        alert(data);
                        document.getElementById("deleteInput").value="";
                        loadHomework();
                    }
                );
        }
        function updateHomework(){
            var id = document.getElementById("updateIDInput").value;
            var name = document.getElementById("updateNameInput").value;
            var token = localStorage.getItem("token");
            fetch("/homework/"+id+"?name="+name
                ,{method:"PUT"
                ,headers:{"Authorization":"Bearer "+token}}
            )
                .then(
                    function (response){
                        return response.text();
                    }
                )
                .then(
                    function (data){
                        alert(data);
                        document.getElementById("updateIDInput").value="";
                        document.getElementById("updateNameInput").value="";
                        loadHomework();
                    }
                )
        }

        function  checkQuestion(){
            var question = document.getElementById("questionInput").value;
            fetch("/check?question="+encodeURIComponent(question),{method:"POST"})
                .then(
                    function (response){
                        return response.text();
                    }
                )
                .then(
                    function (data){
                    document.getElementById("checkResult").innerHTML =data;
                    }
                )
        }
        function showByRole(){
            var role = localStorage.getItem("role");
            var teacherArea = document.getElementById("teacherArea");
            var aiArea= document.getElementById("aiArea");
            if(role === "teacher"){
                teacherArea.style.display = "block";
                aiArea.style.display="block";
            }else{
                teacherArea.style.display = "none";
                aiArea.style.display="none";
            }
        }
        loadHomework();
        showByRole();
    </script>
</div>
</body>
</html>
